# A Task that runs Claude Code against a prompt on your Claude subscription.
#
# Before applying, put the subscription token in a Secret in the atespace:
#
#   kubectl create secret generic claude-subscription \
#     --from-literal=CLAUDE_CODE_OAUTH_TOKEN="$(claude setup-token)"
#   kubectl label secret claude-subscription ax.io/agent-credential=true
#
# The label marks the Secret as one Models may hand to task containers;
# unlabeled Secrets are refused.
#
# For Codex instead, log in once on your machine and store its auth file:
#
#   kubectl create secret generic codex-subscription \
#     --from-file=auth.json="$HOME/.codex/auth.json"
#   kubectl label secret codex-subscription ax.io/agent-credential=true
#
# and change the Model to:
#
#   spec:
#     provider: codex
#     model: gpt-5.5-codex
#     secretKey: {name: codex-subscription, key: auth.json}

apiVersion: ax.io/v1alpha1
kind: Model
metadata:
  name: default-model
  atespace: default
spec:
  provider: claude-code
  model: claude-opus-5-5
  secretKey:
    name: claude-subscription
    key: CLAUDE_CODE_OAUTH_TOKEN
---
apiVersion: ax.io/v1alpha1
kind: Workspace
metadata:
  name: golang
  atespace: default
spec:
  git:
    - repo: "https://github.com/golang/go.git"
      branch: "master"
      depth: 1
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: fix-flaky
  atespace: default
spec:
  workspace:
    name: golang
    # The same agent prepares the workspace on first boot.
    goal: "Make sure the Go toolchain builds from source"
  # agent replaces command: one prompt, run in /workspace by the Model's agent.
  agent:
    prompt: "Find the flaky test under src/sync and make it deterministic. Commit on a branch."
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"
  debug: true # lets you `ax ssh fix-flaky` to watch the agent work
